name: GuardDog
on:
  # Pull request alerts are compared against the latest analysis of main.
  push:
    branches: [main]
    paths:
      # GuardDog supports PyPI, NPM and GitHub Actions
      - '**/pnpm-lock.yaml'
      - '**/poetry.lock'
      - '.github/workflows/**'
      - '.github/scripts/*guarddog_sarif.py'
  pull_request:
    paths:
      - '**/pnpm-lock.yaml'
      - '**/poetry.lock'
      - '.github/workflows/**'
      - '.github/scripts/*guarddog_sarif.py'

permissions:
  contents: read

# A given ref only needs the latest scan.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install latest version of GuardDog
        run: |
          pip install guarddog pytest pyyaml
          guarddog --version

      # This scans every dependency, not just the ones a pull request changes.
      # GitHub compares the results with main's and annotates the pull request
      # with the new alerts only. The step fails if any scan fails, but not on
      # findings: a code scanning ruleset blocks merging on high-severity alerts
      # (GuardDog "high_risk"), and dismissing the alert after review unblocks it.
      - name: Scan dependencies with GuardDog
        run: python .github/scripts/guarddog_sarif.py guarddog.sarif

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: guarddog.sarif
          category: guarddog
